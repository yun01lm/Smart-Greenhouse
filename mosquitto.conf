# ===========================================
# Mosquitto MQTT Broker 配置
# ===========================================
# 开发阶段使用匿名连接，生产阶段需启用认证

# 监听端口
listener 1883
protocol mqtt

# WebSocket MQTT（APP可直接通过WebSocket连MQTT）
listener 9001
protocol websockets

# 开发阶段：允许匿名连接
# 生产阶段：改为 false，并配置 password_file
allow_anonymous true

# 持久化
persistence true
persistence_location /mosquitto/data/

# 日志
log_dest stdout
log_type all
log_timestamp true
connection_messages true
