# ===========================================
# Mosquitto MQTT Broker 配置（安全加固版）
# ===========================================
# 生产环境必须启用认证，禁止匿名连接

# 监听端口
listener 1883
protocol mqtt

# WebSocket MQTT（APP可直接通过WebSocket连MQTT）
listener 9001
protocol websockets

# 禁用匿名连接（安全加固）
allow_anonymous false

# 密码文件（使用 mosquitto_passwd 工具创建）
password_file /mosquitto/config/passwd

# ACL 权限控制文件
acl_file /mosquitto/config/acl

# 持久化
persistence true
persistence_location /mosquitto/data/

# 日志
log_dest stdout
log_type all
log_timestamp true
connection_messages true
