# ===========================================
# 智慧大棚AIoT系统 — 开发环境配置
# ===========================================

spring:
  # HTTP 请求/响应统一 UTF-8（防止 multipart 表单字段中文乱码，如知识库分类）
  # （实际配置在 application.yml server.servlet.encoding，此处仅为说明；见 application.yml）
  # 数据源 — MySQL
  datasource:
    url: jdbc:mysql://localhost:3306/smart_greenhouse?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8
    username: root
    password: ${MYSQL_ROOT_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # HikariCP 连接池调优
  hikari:
    maximum-pool-size: 20
    minimum-idle: 5
    connection-timeout: 30000
    idle-timeout: 600000

  # 文件上传
  servlet:
    multipart:
      max-file-size: 30MB
      max-request-size: 35MB

  # JPA
  jpa:
    hibernate:
      ddl-auto: update          # 开发阶段自动建表，生产改为 validate
    show-sql: true              # 开发阶段打印SQL
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  # AI — DeepSeek Chat（通过Spring AI OpenAI兼容接口）
  ai:
    openai:
      api-key: ${DEEPSEEK_API_KEY:dev-deepseek-key}
      base-url: https://api.deepseek.com
      chat:
        options:
          model: deepseek-chat
      embedding:
        enabled: false           # DeepSeek不提供Embedding

# InfluxDB
influxdb:
  url: http://localhost:8086
  token: ${INFLUX_TOKEN:dev-token-greenhouse-2026}
  org: greenhouse
  bucket: sensor_data

# Chroma 向量数据库
chroma:
  base-url: http://localhost:8000
  collection: greenhouse_knowledge

# DeepSeek Chat（独立HTTP调用）
deepseek:
  api-key: ${DEEPSEEK_API_KEY:dev-deepseek-key}
  base-url: https://api.deepseek.com/v1
  model: deepseek-chat

# MQTT Broker（安全加固：启用认证）
mqtt:
  broker: tcp://localhost:1883
  username: ${MQTT_USER:greenhouse}
  password: ${MQTT_PASSWORD:greenhouse_dev}
  client-id: greenhouse-backend-${random.uuid}

# JWT 配置
jwt:
  secret: ${JWT_SECRET:dev-secret-key-greenhouse-2026-must-be-at-least-256-bits-long}
  expiration: 7200000             # Token有效期：2小时（毫秒）

# 文件存储
file:
  upload-dir: ./uploads
  max-file-size: 30MB

# 第三方API
baidu:
  ai:
    api-key: ${BAIDU_API_KEY:dev-baidu-key}
    secret-key: ${BAIDU_SECRET_KEY:dev-baidu-secret}

xunfei:
  app-id: ${XUNFEI_APP_ID:dev-xunfei-id}
  api-key: ${XUNFEI_API_KEY:dev-xunfei-key}
  api-secret: ${XUNFEI_API_SECRET:dev-xunfei-secret}

siliconflow:
  api-key: ${SILICONFLOW_API_KEY:dev-siliconflow-key}
  base-url: https://api.siliconflow.cn/v1
  embedding-model: BAAI/bge-m3

qweather:
  api-key: ${QWEATHER_API_KEY:dev-qweather-key}
  base-url: https://devapi.qweather.com

# AI引擎切换（RC验收默认使用 Mock 模式）
ai:
  image:
    provider: mock              # mock | baidu | resnet
  voice:
    provider: mock              # mock | xunfei | whisper
  llm:
    provider: ${AI_LLM_PROVIDER:mock}            # mock | deepseek（R7 真实问答；.env.local 注入）
  embedding:
    provider: ${AI_EMBEDDING_PROVIDER:mock}      # mock | siliconflow（R6 真实向量化；.env.local 注入 SILICONFLOW_API_KEY）

# 天气服务
weather:
  provider: ${WEATHER_PROVIDER:mock}   # mock | qweather（.env.local 注入 WEATHER_PROVIDER）

# 多模态融合配置（论文对比实验：修改权重无需重新编译）
greenhouse:
  # 方言语料上传目录（与 file.upload-dir 保持一致，AdminCorpusService 读取）
  upload:
    path: ./uploads
  # RAG 问答配置
  ai:
    rag:
      # 农业域守卫：问题预检（R7），非农问题直接拦截不调用 LLM
      agriculture-guard-enabled: true
      system-prompt: |
        你是一个专业的农业助手，精通大棚蔬菜种植、病虫害防治、水肥管理等农业技术。
        请根据以下知识库内容回答用户问题。
        
        要求：
        1. 优先使用知识库内容回答，如果知识库中有相关内容请以此为准
        2. 如果知识库内容不充分，可以结合你的通用农业知识补充
        3. 回答要专业、准确、实用，适合农户理解
        4. 回答末尾标注引用来源（如有）
        5. 你是农业领域的专用助手，只回答与农业种植、养殖、农艺管理相关的问题。
           如果用户问题与农业无关（如写诗、编程、翻译、闲聊、时事等），
           必须明确拒绝并引导用户回到农业话题，不得回答非农业内容，也不得编造农业信息。
        
        知识库参考内容：
        %s
      temperature: 0.7
      max-tokens: 2000
      top-k: 5
      # RAG 相似度阈值（兜底防污染）：低于该值的检索结果不参与上下文组装
      # 全部低于阈值时降级为通用农业知识回答（可按实际效果调整）
      min-similarity: 0.3
  # 多模态融合权重
  fusion:
    env:
      compliance: 0.5
      stability: 0.3
      consistency: 0.2
    visual:
      disease: 0.6
      growth: 0.4
    overall:
      env-weight: 0.6
      visual-weight: 0.4

# 日志
logging:
  level:
    com.greenhouse: DEBUG
    org.springframework.ai: DEBUG
    org.springframework.security: DEBUG
